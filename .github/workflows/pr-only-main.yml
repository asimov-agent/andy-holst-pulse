name: PR-only main

on:
  push:
    branches: [main]

jobs:
  check-pr-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check if commit came from PR
        run: |
          # Get the commit message
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $COMMIT_MSG"
          
          # Check if this is a merge commit from PR
          # Merge commits from PRs typically have message like "Merge pull request #N from..."
          if echo "$COMMIT_MSG" | grep -q "^Merge pull request #"; then
            echo "✅ Commit is a PR merge — allowed"
            exit 0
          fi
          
          # Check if this is a revert of a previous direct push (allowed for fixing violations)
          if echo "$COMMIT_MSG" | grep -q "^Revert "; then
            echo "⚠️ Revert commit — allowed for fixing workflow violations"
            exit 0
          fi
          
          # Otherwise, this is a direct push to main — block it
          echo "❌ Direct push to main is NOT allowed!"
          echo "All changes must go through: Issue → Worktree → Branch → PR → Merge"
          echo "See AGENTS.md for the mandatory workflow."
          exit 1
