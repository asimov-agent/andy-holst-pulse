<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andy Holst — GitHub Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a25;
  --border: #2a2a3a;
  --text: #e4e4ef;
  --text2: #9494a8;
  --accent: #6c5ce7;
  --accent2: #a29bfe;
  --green: #00b894;
  --red: #ff6b6b;
  --yellow: #ffeaa7;
  --blue: #74b9ff;
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

/* Loading */
.loading {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:60vh; gap:1.5rem;
}
.spinner {
  width:48px; height:48px; border:4px solid var(--border);
  border-top-color:var(--accent); border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg) } }
.loading-text { color:var(--text2); font-size:.9rem; }

/* Header */
.header {
  display:flex; align-items:center; gap:1.5rem;
  margin-bottom:2rem; padding-bottom:2rem;
  border-bottom:1px solid var(--border);
}
.avatar {
  width:80px; height:80px; border-radius:50%;
  border:3px solid var(--accent);
  box-shadow:0 0 30px rgba(108,92,231,.3);
}
.header-info h1 {
  font-size:1.8rem; font-weight:800;
  background:linear-gradient(135deg,var(--accent2),var(--blue));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.header-info .handle { color:var(--text2); font-size:.95rem; }
.header-info .bio { color:var(--text2); font-size:.85rem; margin-top:.25rem; }

.live-dot {
  display:inline-block; width:8px; height:8px;
  background:var(--green); border-radius:50%;
  animation:pulse 2s ease-in-out infinite; margin-right:6px;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.live-label { font-size:.7rem; color:var(--green); text-transform:uppercase; letter-spacing:1px; }

/* Stats */
.stats-row {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:1rem; margin-bottom:2rem;
}
.stat-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:1rem; text-align:center;
  transition:transform .2s, border-color .2s;
}
.stat-card:hover { transform:translateY(-2px); border-color:var(--accent); }
.stat-value { font-size:1.5rem; font-weight:700; color:var(--accent2); }
.stat-label { font-size:.7rem; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }

/* Filters */
.filters {
  display:flex; flex-wrap:wrap; gap:.5rem;
  margin-bottom:2rem; padding-bottom:1rem;
  border-bottom:1px solid var(--border);
}
.filter-btn {
  background:var(--surface); color:var(--text2);
  border:1px solid var(--border);
  border-radius:8px; padding:.5rem 1rem;
  font-size:.8rem; font-weight:500;
  cursor:pointer; transition:all .2s;
}
.filter-btn:hover { border-color:var(--accent); color:var(--text); }
.filter-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.filter-btn .count { display:inline-block; margin-left:4px; font-size:.7rem; opacity:.8; }

/* Grid */
.grid { display:grid; grid-template-columns:1.4fr 1fr; gap:1.5rem; margin-bottom:2rem; }
@media (max-width:900px) { .grid { grid-template-columns:1fr } }

.section {
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:1.5rem;
}
.section-title {
  font-size:1rem; font-weight:600; margin-bottom:1rem;
  display:flex; align-items:center; gap:.5rem;
}

/* Activity Feed */
.events-list { max-height:700px; overflow-y:auto; }
.event-card {
  display:block; padding:1rem;
  border-bottom:1px solid var(--border);
  text-decoration:none; color:inherit;
  border-radius:8px; transition:background .15s;
  cursor:pointer;
}
.event-card:last-child { border-bottom:none; }
.event-card:hover { background:var(--surface2); }
.event-header {
  display:flex; align-items:center; gap:.75rem;
  font-size:.9rem; font-weight:500;
}
.event-icon { font-size:1.2rem; flex-shrink:0; }
.event-title { flex:1; color:var(--text); }
.event-title code {
  background:var(--surface2); padding:2px 6px; border-radius:4px;
  font-size:.75rem; font-family:'JetBrains Mono',monospace;
  color:var(--accent2);
}
.event-meta {
  display:flex; align-items:center; gap:.75rem; margin-top:.5rem;
  font-size:.75rem; color:var(--text2);
}
.event-badge {
  display:inline-block; padding:2px 8px; border-radius:99px;
  font-size:.68rem; font-weight:600; text-transform:uppercase;
}
.badge-open { background:rgba(0,184,148,.15); color:var(--green); }
.badge-merged { background:rgba(108,92,231,.15); color:var(--accent2); }
.badge-closed { background:rgba(255,107,107,.15); color:var(--red); }
.badge-review { background:rgba(116,185,255,.15); color:var(--blue); }
.event-body {
  color:var(--text2); font-size:.8rem; margin-top:.5rem;
  line-height:1.5; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
}
.event-body ul { margin:.3rem 0 0; padding-left:1.2rem; }
.event-body li { margin-bottom:.15rem; }
.event-footer {
  display:flex; align-items:center; gap:1rem; margin-top:.6rem;
  font-size:.72rem; color:var(--text2);
  font-family:'JetBrains Mono',monospace;
}
.event-link {
  color:var(--accent2); text-decoration:none;
  display:inline-flex; align-items:center; gap:.3rem;
}
.event-link:hover { text-decoration:underline; }

/* Repo bars */
.repo-bar {
  display:flex; align-items:center; gap:.75rem;
  margin-bottom:.6rem; font-size:.8rem;
}
.repo-name { width:100px; flex-shrink:0; color:var(--text2); font-weight:500; }
.bar-track { flex:1; height:8px; background:var(--surface2); border-radius:4px; overflow:hidden; }
.bar-fill { height:100%; border-radius:4px; transition:width .5s ease; }
.repo-count { width:25px; text-align:right; color:var(--text2); font-family:'JetBrains Mono',monospace; font-size:.75rem; }

/* Repo cards */
.repos-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:1rem; margin-bottom:2rem;
}
.repo-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:1.2rem;
  text-decoration:none; color:inherit;
  transition:transform .2s, border-color .2s, box-shadow .2s;
}
.repo-card:hover {
  transform:translateY(-3px); border-color:var(--accent);
  box-shadow:0 8px 30px rgba(108,92,231,.15);
}
.repo-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:.5rem; }
.repo-card-name { font-weight:600; font-size:.9rem; }
.repo-card-lang { font-size:.7rem; font-weight:600; }
.repo-card-desc { font-size:.75rem; color:var(--text2); margin-bottom:.75rem; line-height:1.4; }
.repo-card-stats { display:flex; gap:1rem; font-size:.75rem; color:var(--text2); }

/* Footer */
.footer {
  text-align:center; padding:2rem 0; color:var(--text2);
  font-size:.8rem; border-top:1px solid var(--border); margin-top:2rem;
}
.footer a { color:var(--accent2); text-decoration:none; }
.footer a:hover { text-decoration:underline; }

/* Scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(--surface); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* Animation */
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.event-card { animation: fadeUp .25s ease both; }
</style>
</head>
<body>
<div class="container">

<!-- Loading -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <div class="loading-text">Fetching live data from GitHub...</div>
</div>

<!-- Error -->
<div id="error" class="error-box" style="display:none; padding:2rem; text-align:center;">
  <h2>⚠️ Could not load GitHub data</h2>
  <p id="error-msg" style="color:var(--text2);margin-top:.5rem"></p>
  <button onclick="location.reload()" style="background:var(--accent);color:#fff;border:none;padding:.5rem 1.5rem;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:1rem">Retry</button>
</div>

<!-- Content -->
<div id="content" style="display:none">

  <!-- Header -->
  <div class="header">
    <img id="avatar" class="avatar" src="" alt="">
    <div class="header-info">
      <h1 id="name"></h1>
      <div class="handle"><span class="live-dot"></span><span class="live-label">LIVE</span> <span id="handle"></span> · <span id="location"></span></div>
      <div id="bio" class="bio"></div>
    </div>
  </div>

  <!-- Profile Stats -->
  <div class="stats-row" id="profile-stats"></div>

  <!-- Activity Stats -->
  <div class="stats-row" id="activity-stats"></div>

  <!-- Filters -->
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All <span class="count" id="count-all"></span></button>
    <button class="filter-btn" data-filter="pr">🔀 PRs <span class="count" id="count-pr"></span></button>
    <button class="filter-btn" data-filter="issue">🐛 Issues <span class="count" id="count-issue"></span></button>
    <button class="filter-btn" data-filter="commit">📦 Commits <span class="count" id="count-commit"></span></button>
    <button class="filter-btn" data-filter="review">👀 Reviews <span class="count" id="count-review"></span></button>
    <button class="filter-btn" data-filter="fork">🍴 Forks <span class="count" id="count-fork"></span></button>
    <button class="filter-btn" data-filter="star">⭐ Stars <span class="count" id="count-star"></span></button>
    <button class="filter-btn" data-filter="release">🚀 Releases <span class="count" id="count-release"></span></button>
  </div>

  <!-- Main grid -->
  <div class="grid">
    <div class="section">
      <div class="section-title">⚡ Recent Activity</div>
      <div class="events-list" id="events-list"></div>
    </div>
    <div class="section">
      <div class="section-title">📊 Top Active Repos</div>
      <div id="repo-bars"></div>
    </div>
  </div>

  <!-- Featured Repos -->
  <div class="section" style="margin-bottom:2rem">
    <div class="section-title">📦 Featured Repositories</div>
    <div class="repos-grid" id="repos-grid"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p>🔥 <b>GitHub Pulse</b> for <a href="https://github.com/andyholst">@andyholst</a></p>
    <p style="margin-top:.5rem">
      <a href="https://docondee.com">🌐 docondee.com</a> ·
      <a href="https://x.com/andy_a_holst">𝕏 @andy_a_holst</a> ·
      <a href="https://linkedin.com/in/andy-holst-devops-software-engineer">💼 LinkedIn</a>
    </p>
    <p style="margin-top:.75rem;opacity:.6">Refreshed <span id="refreshed-at"></span></p>
  </div>

</div>
</div>

<script>
const USER = 'andyholst';
const API = `https://api.github.com/users/${USER}`;
const COLORS = ['#ff6b6b','#4ecdc4','#45b7d1','#96ceb4','#ffeaa7','#dfe6e9','#fd79a8','#a29bfe','#6c5ce7','#00b894','#e17055','#fdcb6e','#e84393','#00cec9','#fab1a0'];

/* helpers */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeAgo = dt => {
  const d = (Date.now() - new Date(dt)) / 1000;
  if (d < 60) return `${Math.floor(d)}m ago`;
  if (d < 3600) return `${Math.floor(d/60)}h ago`;
  if (d < 86400) return `${Math.floor(d/3600)}d ago`;
  return `${Math.floor(d/86400)}d ago`;
};
const icon = t => ({PushEvent:'📦',PullRequestEvent:'🔀',PullRequestReviewEvent:'👀',CreateEvent:'🌱',ForkEvent:'🍴',WatchEvent:'⭐',IssueCommentEvent:'💬',IssuesEvent:'🐛',ReleaseEvent:'🚀',DeleteEvent:'🗑️',CommitCommentEvent:'💬',GollumEvent:'📖'}[t]||'✨');

/* event → GitHub URL */
function evUrl(e) {
  const repo = e.repo?.name || '';
  const p = e.payload || {};
  switch(e.type) {
    case 'PushEvent': {
      const b = p.before || '', h = p.head || '';
      return b && h ? `https://github.com/${repo}/compare/${b}...${h}` : `https://github.com/${repo}`;
    }
    case 'PullRequestEvent': return p.pull_request?.html_url || `https://github.com/${repo}`;
    case 'PullRequestReviewEvent': return p.review?.html_url || `https://github.com/${repo}`;
    case 'IssuesEvent': return p.issue?.html_url || `https://github.com/${repo}/issues`;
    case 'IssueCommentEvent': return p.comment?.html_url || `https://github.com/${repo}/issues`;
    case 'CreateEvent': {
      const r = p.ref || '';
      if (p.ref_type === 'branch') return `https://github.com/${repo}/tree/${r}`;
      if (p.ref_type === 'tag') return `https://github.com/${repo}/releases/tag/${r}`;
      return `https://github.com/${repo}`;
    }
    case 'ForkEvent': return p.forkee?.html_url || `https://github.com/${repo}`;
    case 'ReleaseEvent': return p.release?.html_url || `https://github.com/${repo}/releases`;
    case 'CommitCommentEvent': return p.comment?.html_url || `https://github.com/${repo}`;
    default: return `https://github.com/${repo}`;
  }
}

/* event → {title, body, badge, linkLabel} */
function evCard(e) {
  const repo = (e.repo?.name || '').split('/').pop();
  const p = e.payload || {};

  if (e.type === 'PushEvent') {
    const cs = p.commits || [];
    if (!cs.length) return { title: `Pushed to <b>${esc(repo)}</b>`, body: '', badge: null, linkLabel: `github.com/${repo}` };
    const items = cs.slice(0,5).map(c => {
      const msg = (c.message||'').split('\n')[0].slice(0,80);
      const sha = (c.id||'').slice(0,7);
      return `<li><code>${esc(sha)}</code> ${esc(msg)}</li>`;
    }).join('');
    const extra = cs.length > 5 ? `<li style="color:var(--text2)">...and ${cs.length - 5} more</li>` : '';
    return {
      title: `📦 Pushed <b>${cs.length}</b> commit${cs.length>1?'s':''} to <b>${esc(repo)}</b>`,
      body: `<ul style="margin:.4rem 0 0;padding-left:1.2rem">${items}${extra}</ul>`,
      badge: null,
      linkLabel: `github.com/${repo}`
    };
  }

  if (e.type === 'PullRequestEvent') {
    const pr = p.pull_request || {};
    const num = pr.number || '?';
    const title = pr.title || '?';
    const body = (pr.body || '').slice(0,200);
    const action = p.action || '?';
    const merged = pr.merged;
    if (action === 'opened')
      return { title: `🔀 Opened PR <b>#${esc(num)}</b> on <b>${esc(repo)}</b>`, body: body ? `<p style="margin:.4rem 0 0;color:var(--text2)">${esc(body)}</p>` : '', badge: 'open', linkLabel: `${repo}/pull/${num}` };
    if (action === 'closed' && merged)
      return { title: `✅ Merged PR <b>#${esc(num)}</b> on <b>${esc(repo)}</b>`, body: `<p style="margin:.4rem 0 0;font-style:italic">${esc(title)}</p>`, badge: 'merged', linkLabel: `${repo}/pull/${num}` };
    if (action === 'closed')
      return { title: `❌ Closed PR <b>#${esc(num)}</b> on <b>${esc(repo)}</b>`, body: `<p style="margin:.4rem 0 0;font-style:italic">${esc(title)}</p>`, badge: 'closed', linkLabel: `${repo}/pull/${num}` };
    if (merged)
      return { title: `✅ Merged PR <b>#${esc(num)}</b> on <b>${esc(repo)}</b>`, body: `<p style="margin:.4rem 0 0;font-style:italic">${esc(title)}</p>`, badge: 'merged', linkLabel: `${repo}/pull/${num}` };
    return { title: `PR <b>#${esc(num)}</b> [${esc(action)}] on <b>${esc(repo)}</b>`, body: `<p style="margin:.4rem 0 0;font-style:italic">${esc(title)}</p>`, badge: null, linkLabel: `${repo}/pull/${num}` };
  }

  if (e.type === 'PullRequestReviewEvent') {
    const rev = p.review || {};
    const state = rev.state || '?';
    const body = (rev.body || '').slice(0,200);
    const prUrl = rev.pull_request_url || '';
    const prNum = prUrl.split('/').pop() || '?';
    const stateMap = {approved:'✅ Approved',changes_requested:'🔴 Changes requested',commented:'💬 Commented',dismissed:'🚫 Dismissed'};
    return {
      title: `${stateMap[state] || state} PR <b>#${esc(prNum)}</b> on <b>${esc(repo)}</b>`,
      body: body ? `<p style="margin:.4rem 0 0;color:var(--text2)">${esc(body)}</p>` : '',
      badge: 'review',
      linkLabel: `${repo}/pull/${prNum}`
    };
  }

  if (e.type === 'IssuesEvent') {
    const issue = p.issue || {};
    const num = issue.number || '?';
    const title = issue.title || '?';
    const body = (issue.body || '').slice(0,200);
    const action = (p.action || '?').charAt(0).toUpperCase() + (p.action || '?').slice(1);
    return {
      title: `🐛 ${esc(action)} issue <b>#${esc(num)}</b> on <b>${esc(repo)}</b>`,
      body: `<p style="margin:.4rem 0 0;font-style:italic">${esc(title)}</p>${body ? `<p style="margin:.3rem 0 0;color:var(--text2)">${esc(body)}</p>` : ''}`,
      badge: action === 'Opened' ? 'open' : action === 'Closed' ? 'closed' : null,
      linkLabel: `${repo}/issues/${num}`
    };
  }

  if (e.type === 'IssueCommentEvent') {
    const comment = p.comment || {};
    const body = (comment.body || '').slice(0,200);
    const issue = p.issue || {};
    const num = issue.number || '?';
    const title = issue.title || '';
    return {
      title: `💬 Commented on issue <b>#${esc(num)}</b> on <b>${esc(repo)}</b>`,
      body: `<p style="margin:.4rem 0 0;font-style:italic">${esc(title)}</p>${body ? `<p style="margin:.3rem 0 0;color:var(--text2)">${esc(body)}</p>` : ''}`,
      badge: 'review',
      linkLabel: `${repo}/issues/${num}`
    };
  }

  if (e.type === 'CreateEvent')
    return { title: `🌱 Created ${esc(p.ref_type||'resource')} <b>${esc(p.ref||'?')}</b> in <b>${esc(repo)}</b>`, body: '', badge: null, linkLabel: `github.com/${repo}` };

  if (e.type === 'ForkEvent') {
    const fname = p.forkee?.full_name || '?';
    return { title: `🍴 Forked <b>${esc(repo)}</b> → <b>${esc(fname)}</b>`, body: '', badge: null, linkLabel: fname };
  }

  if (e.type === 'WatchEvent')
    return { title: `⭐ Starred <b>${esc(repo)}</b>`, body: '', badge: null, linkLabel: `github.com/${repo}` };

  if (e.type === 'ReleaseEvent') {
    const tag = p.release?.tag_name || '?';
    const name = p.release?.name || '';
    return { title: `🚀 Released <b>${esc(tag)}</b> ${esc(name)} on <b>${esc(repo)}</b>`, body: '', badge: null, linkLabel: `${repo}/releases/tag/${tag}` };
  }

  if (e.type === 'CommitCommentEvent') {
    const body = (p.comment?.body || '').slice(0,200);
    return { title: `💬 Commented on commit in <b>${esc(repo)}</b>`, body: body ? `<p style="margin:.4rem 0 0;color:var(--text2)">${esc(body)}</p>` : '', badge: null, linkLabel: `github.com/${repo}` };
  }

  return { title: `${icon(e.type)} ${esc(e.type)} on <b>${esc(repo)}</b>`, body: '', badge: null, linkLabel: `github.com/${repo}` };
}

/* filter */
const FILTER_MAP = {
  all: null,
  pr: ['PullRequestEvent'],
  issue: ['IssuesEvent', 'IssueCommentEvent'],
  commit: ['PushEvent'],
  review: ['PullRequestReviewEvent', 'CommitCommentEvent'],
  fork: ['ForkEvent'],
  star: ['WatchEvent'],
  release: ['ReleaseEvent'],
};
let allEvents = [];
let currentFilter = 'all';

function applyFilter(events, filter) {
  const allowed = FILTER_MAP[filter];
  if (!allowed) return events;
  return events.filter(e => allowed.includes(e.type));
}

function filterCounts(events) {
  const c = {all: events.length, pr: 0, issue: 0, commit: 0, review: 0, fork: 0, star: 0, release: 0};
  events.forEach(e => {
    if (['PullRequestEvent'].includes(e.type)) c.pr++;
    if (['IssuesEvent','IssueCommentEvent'].includes(e.type)) c.issue++;
    if (['PushEvent'].includes(e.type)) c.commit++;
    if (['PullRequestReviewEvent','CommitCommentEvent'].includes(e.type)) c.review++;
    if (['ForkEvent'].includes(e.type)) c.fork++;
    if (['WatchEvent'].includes(e.type)) c.star++;
    if (['ReleaseEvent'].includes(e.type)) c.release++;
  });
  return c;
}

/* render */
function renderEvents(events) {
  const list = document.getElementById('events-list');
  if (!events.length) {
    list.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--text2)">No activity for this filter ✨</div>';
    return;
  }
  list.innerHTML = events.slice(0,60).map((e, i) => {
    const card = evCard(e);
    const url = evUrl(e);
    const time = timeAgo(e.created_at);
    const badgeHtml = card.badge ? `<span class="event-badge badge-${card.badge}">${card.badge}</span>` : '';
    return `<a href="${esc(url)}" target="_blank" class="event-card" style="animation-delay:${i*40}ms">
      <div class="event-header">
        <span class="event-title">${card.title} ${badgeHtml}</span>
      </div>
      ${card.body}
      <div class="event-footer">
        <span>🕐 ${time}</span>
        <span class="event-link">🔗 ${esc(card.linkLabel)} →</span>
      </div>
    </a>`;
  }).join('');
}

function renderFilters(events) {
  const counts = filterCounts(events);
  document.querySelectorAll('.filter-btn').forEach(btn => {
    const f = btn.dataset.filter;
    const cnt = document.getElementById(`count-${f}`);
    if (cnt) cnt.textContent = counts[f] || '';
  });
}

function renderStats(events) {
  const commits = events.filter(e=>e.type==='PushEvent').reduce((s,e)=>s+(e.payload?.commits||[]).length,0);
  const prsOpened = events.filter(e=>e.type==='PullRequestEvent'&&e.payload?.action==='opened').length;
  const prsMerged = events.filter(e=>e.type==='PullRequestEvent'&&e.payload?.pull_request?.merged).length;
  const reviews = events.filter(e=>e.type==='PullRequestReviewEvent').length;
  const issuesOpened = events.filter(e=>e.type==='IssuesEvent'&&e.payload?.action==='opened').length;
  const forks = events.filter(e=>e.type==='ForkEvent').length;
  const stars = events.filter(e=>e.type==='WatchEvent').length;
  const repos = new Set(events.map(e=>e.repo?.name)).length;

  const stats = [
    [commits, 'Commits', 'var(--green)'],
    [prsOpened, 'PRs Opened', 'var(--blue)'],
    [prsMerged, 'PRs Merged', 'var(--accent)'],
    [reviews, 'Reviews', 'var(--yellow)'],
    [issuesOpened, 'Issues', 'var(--red)'],
    [forks, 'Forks', 'var(--text2)'],
    [stars, 'Stars', 'var(--yellow)'],
    [repos, 'Active Repos', 'var(--accent2)'],
  ];
  document.getElementById('activity-stats').innerHTML = stats.map(([v,l,c]) =>
    `<div class="stat-card" style="border-color:${c}"><div class="stat-value" style="color:${c}">${v}</div><div class="stat-label">${l}</div></div>`
  ).join('');
}

function renderProfileStats(user) {
  const stats = [
    [user.followers||0, 'Followers'],
    [user.following||0, 'Following'],
    [user.public_repos||0, 'Repos'],
    [user.public_gists||0, 'Gists'],
  ];
  document.getElementById('profile-stats').innerHTML = stats.map(([v,l]) =>
    `<div class="stat-card"><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div>`
  ).join('');
}

function renderRepoBars(events) {
  const counts = {};
  events.forEach(e => { const r = (e.repo?.name||'').split('/').pop(); counts[r]=(counts[r]||0)+1; });
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const max = Math.max(...sorted.map(x=>x[1]),1);
  document.getElementById('repo-bars').innerHTML = sorted.map(([name,count],i) => {
    const color = COLORS[i % COLORS.length];
    const w = (count/max)*100;
    return `<div class="repo-bar">
      <span class="repo-name">${esc(name)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
      <span class="repo-count">${count}</span>
    </div>`;
  }).join('');
}

function renderRepos(repos) {
  const top = repos.filter(r=>!r.fork).sort((a,b)=>(b.stargazers_count||0)-(a.stargazers_count||0)).slice(0,8);
  document.getElementById('repos-grid').innerHTML = top.map((r,i) => {
    const color = COLORS[i % COLORS.length];
    return `<a href="${r.html_url}" class="repo-card" target="_blank">
      <div class="repo-card-header">
        <span class="repo-card-name">${esc(r.name)}</span>
        <span class="repo-card-lang" style="color:${color}">${esc(r.language||'')}</span>
      </div>
      <p class="repo-card-desc">${esc((r.description||'').slice(0,80))}</p>
      <div class="repo-card-stats"><span>⭐ ${r.stargazers_count||0}</span><span>🍴 ${r.forks_count||0}</span></div>
    </a>`;
  }).join('');
}

/* main */
async function main() {
  try {
    const headers = { 'Accept': 'application/vnd.github+json' };
    const [user, events, repos] = await Promise.all([
      fetch(API, {headers}).then(r=>r.json()),
      fetch(`${API}/events/public?per_page=100`, {headers}).then(r=>r.json()),
      fetch(`${API}/repos?per_page=100&sort=updated`, {headers}).then(r=>r.json()),
    ]);

    if (!user.login) throw new Error(user.message || 'User not found');
    allEvents = events;

    document.getElementById('avatar').src = user.avatar_url;
    document.getElementById('name').textContent = user.name || 'Andy Holst';
    document.getElementById('handle').innerHTML = `<span class="live-dot"></span><span class="live-label">LIVE</span> @${user.login} · ${user.location||'Sweden'}`;
    document.getElementById('bio').textContent = user.bio || 'DevSecOps Software Engineer & Business Owner';

    renderProfileStats(user);
    renderStats(events);
    renderFilters(events);
    renderEvents(events);
    renderRepoBars(events);
    renderRepos(repos);

    document.getElementById('refreshed-at').textContent = new Date().toLocaleString();

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderEvents(applyFilter(allEvents, currentFilter));
      });
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

  } catch(err) {
    console.error(err);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error-msg').textContent = err.message;
  }
}

main();
</script>
</body>
</html>
